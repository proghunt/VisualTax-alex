#wb-info > .container > *:before {
    background: none repeat scroll 0 0 rgba(0, 0, 0, 0);
    content: " ";
    display: block;
    height: 25px;
    margin-left: -15px;
    margin-right: -15px;
}
#wb-info h2, #wb-info h3 {
    font-size: 120%;
    font-weight: 700;
}
#wb-info li {
    margin-bottom: 0.75em;
}
#gc-tctr {
    margin-bottom: 0;
    padding-right: 0;
    padding-top: 5px;
}
#gc-tctr > *:first-child {
    border-right: 1px solid #999;
    line-height: 1.5;
    padding-right: 10px;
}
[dir="rtl"] #wb-dtmd {
    float: left;
}
[dir="rtl"] #wb-sec .list-group .list-group .list-group-item {
    padding-left: 15px;
    padding-right: 1.8em;
}
[dir="rtl"] #gc-tctr > *:first-child {
    border-left: 1px solid #999;
    border-right: 0 none;
    padding-left: 10px;
    padding-right: 0;
}
}
@media screen and (max-width: 991px) {
#gc-bar, #gcwu-sig {
    display: none;
}
#wmms {
    height: 2em;
    margin-left: 15px;
    margin-top: 4px;
    position: absolute;
    top: 0.3em;
}
.wb-disable header {
    background: none repeat scroll 0 0 #ebeae9;
}
.wb-disable #wmms {
    position: static;
}
#wb-bar {
    min-height: 3em;
}
#wb-bnr {
    background-color: #174f88;
    background-image: linear-gradient(#4474ad, #4474ad, #174f88);
}
#wb-sttl {
    position: relative;
}
#wb-sttl a {
    font-size: 1.5em;
    text-shadow: 0 1px 1px #044062;
}
#wb-glb-mn .pnl-btn {
    float: right;
    margin: 0;
    position: relative;
    z-index: 2;
}
#wb-glb-mn .pnl-btn li {
    padding: 4px 0 4px 10px;
    width: 100%;
}
#wb-glb-mn .pnl-btn a {
    color: #000;
    display: block;
    font-size: 1.7em;
    line-height: 1em;
    width: 100%;
}
#wb-glb-mn .pnl-btn span .glyphicon-th-list {
    padding-left: 10px;
    top: 0;
}
#mb-pnl #wb-srch-sub-imprt, #mb-pnl #wb-srch-sub-imprt:active, #mb-pnl #wb-srch-sub-imprt:focus, #mb-pnl #wb-srch-sub-imprt:hover, #mb-pnl .sm-pnl a, #mb-pnl .sm-pnl summary, #mb-pnl .sm-pnl summary:focus, #mb-pnl .sm-pnl summary:hover {
    color: #fff;
}
#mb-pnl {
    background: none repeat scroll 0 0 #efefef;
}
#mb-pnl header {
    background-color: #174f88;
}
#mb-pnl nav a {
    color: #000;
    text-decoration: none;
}
#mb-pnl summary:focus, #mb-pnl summary:hover {
    background: none repeat scroll 0 0 rgba(0, 0, 0, 0);
}
#mb-pnl .modal-body {
    background: none repeat scroll 0 0 #efefef;
    padding: 0;
}
#mb-pnl .srch-pnl .form-group {
    float: left;
    margin-right: 5px;
    width: 75%;
}
#mb-pnl #wb-srch-sub-imprt {
    background: none repeat scroll 0 0 #146094;
    border-color: #146094;
}
#mb-pnl #wb-srch-sub-imprt:active, #mb-pnl #wb-srch-sub-imprt:focus, #mb-pnl #wb-srch-sub-imprt:hover {
    background-color: #3276b1;
    border-color: #285e8e;
}
#mb-pnl .lng-ofr a {
    color: #000;
    text-decoration: none;
}
#mb-pnl .sm-pnl {
    background: none repeat scroll 0 0 #146094;
}
#wb-srch {
    margin-right: 15px;
    text-align: right;
}
#wb-srch .form-group {
    display: inline-block;
}
#wb-srch-sub {
    float: right;
    margin-left: 5px;
}
#wb-bc {
    background-color: #dfdfdd;
    background-image: linear-gradient(#f0efef, #dfdfdd);
}
#gc-info {
    display: none;
}
[dir="rtl"] #wb-srch {
    margin-left: 15px;
    text-align: left;
}
[dir="rtl"] #wb-srch-sub {
    float: right;
    margin-left: 5px;
    margin-right: 0;
}
[dir="rtl"] #mb-pnl .srch-pnl .form-group {
    float: right;
    margin-left: 5px;
    margin-right: auto;
    width: 75%;
}
[dir="rtl"] #wmms {
    left: auto;
    right: 15px;
}
[dir="rtl"] #wb-glb-mn > ul {
    text-align: left;
}
[dir="rtl"] #wb-glb-mn .pnl-btn {
    float: left;
}
[dir="rtl"] #wb-glb-mn .pnl-btn span .glyphicon-th-list {
    padding-left: 0;
    padding-right: 10px;
}
}
@media screen and (min-width: 992px) {
#wb-bc .container, #wb-info > .container > *:before, body main.container, body > header + .container {
    background-color: #fff;
    border-left: 1px solid #ccc;
    border-right: 1px solid #ccc;
}
#wb-srch .btn, #wb-srch input {
    border-radius: 2px;
    height: 26px;
}
#wmms {
    height: 2em;
}
[dir="rtl"] #canada-ca, [dir="rtl"] #gc-bar, [dir="rtl"] #wmms {
    float: left;
}
#canada-ca, #gc-bar, #wb-srch, #wmms, [dir="rtl"] #wb-sttl {
    float: right;
}
#gc-bar a:link, #gc-bar a:visited, #wb-sm .sm a:link, #wb-sm .sm a:visited {
    text-decoration: none;
}
#gc-bar a:focus, #gc-bar a:hover, #wb-sm .sm a:focus, #wb-sm .sm a:hover {
    text-decoration: underline;
}

#gcwu-sig {
    margin-left: 15px;
    position: absolute;
}
#wmms {
    margin-right: 15px;
    margin-top: 2.3em;
}
#wb-bar {
    line-height: 1;
}
#gc-bar {
    margin: 15px 10px;
}
#gc-bar li {
    padding: 0;
}
#gc-bar a {
    border-left: 1px solid #fff;
    padding: 0 0.5em;
}
#gc-bar > li:first-child a {
    border-left: 0 none;
}
#gc-bar ul li:last-child a {
    border-right: 0 none;
}
#wb-bnr > .container {
    position: relative;
}
#wb-sttl {
    display: table-row;
    margin-bottom: 5px;
    margin-top: 5px;
}
#wb-sttl a {
    display: table-cell;
    font-size: 1.9em;
    height: 3.6em;
    text-shadow: 1px 1px 1px #333;
    vertical-align: middle;
}
#wb-srch {
    background: none repeat scroll 0 0 #146094;
    border-left: 1px solid #15527d;
    border-right: 1px solid #15527d;
    border-top: 1px solid #87aec9;
    bottom: -1px;
    padding: 11px 15px 6px;
    position: absolute;
    right: 0;
    z-index: 2;
}
#wb-srch input {
    padding: 2px 0;
}
#wb-srch .btn {
    background-color: #ccc;
    background-image: linear-gradient(#f0f0f0, #ccc);
    line-height: 1;
