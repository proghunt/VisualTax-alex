<!DOCTYPE html>
<html lang="en">
<head>
  <title>Virtual Tax Office</title>
    <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" type="text/css" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <link rel="stylesheet" type="text/css" href="%URL%css/virtualtaxoffice.css?v=%VERSION%">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
  <script src="js/virtualtaxoffice.js?v=%VERSION%"></script> 
  <script>  
    const LEFT_PANEL_COLOR = '%LEFT_PANEL_COLOR%';
    const RIGHT_PANEL_COLOR = '%RIGHT_PANEL_COLOR%';
    const FLOOR_COLOR = '%FLOOR_COLOR%';
    const GROUT_COLOR = '%GROUT_COLOR%';
    const BORDER_COLOR = '%BORDER_COLOR%';
    const BORDER_WIDTH = %BORDER_WIDTH%;
  </script></head>
<body>
<table id="holder" style="background-color: %BACKGROUND_COLOR%; background-image: url('%BACKGROUND_FILENAME%'); background-repeat: %BACKGROUND_REPEAT%; ">
    <tr >
        <td></td>
        <td>
            <div class="header">
                <div id="title_small_panel" style="background-color: %TITLE_SMALL_COLOR%;">&nbsp</div>
                <div id="title_panel" style="background-color: %TITLE_COLOR%; border: %BORDER%;">
                    <table id="titles" border=0 width=100%>
                        <tr>
                            <td style="width: 250px">
                                <img id="logo" src="%LOGO_FILENAME%" style=" ">
                            </td>
                            <td class="padding_left_right_10 text-center">
                                <div><h1 id="company_name" class="titles" style="visibility: hidden; color: %COMPANY_NAME_COLOR%">%COMPANY_NAME%</h1></div>
                                <div><h3 id="logo_message" class="titles" style="visibility: hidden; color: %LOGO_MESSAGE_COLOR%">%LOGO_MESSAGE%</h3></div>
                            </td>
                        </tr>
                    </table>
                </div>
            </div>
        </td>
        <td></td>
    </tr>
    <tr class="inner_body">
        <td id="left_panel_column">            
            <div id="left_panel_div" class="left_panel well functions_panel" style="background-color: %LEFT_PANEL_COLOR%; border: %BORDER%; border-bottom-style: none; ">                
                <div class="form-group" style="position: relative;">
                <button style="float: right;" onclick="left_collapse_expand();"><img id="left_collapse_expand_img" src="img/collapse.png"></button>
                </div><br>
                <button type="button" class="btn btn-primary">Login</button>
            </div>
        </td>
        <td class="content">
            <div class="content_div" style="background-color: %PROJECTOR_COLOR%; border: %BORDER%;">
            <h1>Welcome to Virtual Tax Office</h1>
            </div>
        </td>
        <td id="right_panel_column">
            <div id="right_panel_div" class="right_panel well functions_panel" style="background-color: %RIGHT_PANEL_COLOR%; border: %BORDER%; border-bottom-style: none; ">
                <div class="form-group" style="position: relative;">
                <button style="float: left;" onclick="right_collapse_expand();"><img id="right_collapse_expand_img" src="img/collapse.png"></button>
                </div><br>
            </div>
        </td>
    </tr>
    <tr class="floor">
        <td colspan=3 ><canvas id="floor_canvas"></canvas></td>
    </tr>
</table>
<script>
    if (localStorage.getItem("left_panel_visible") == "false") {
        left_collapse_expand();
    }
    if (localStorage.getItem("right_panel_visible") == "false") {
        right_collapse_expand();
    }
</script>
</body>
</html>
